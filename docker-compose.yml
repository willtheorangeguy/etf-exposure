services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etf
      POSTGRES_USER: etf
      POSTGRES_PASSWORD: etf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etf -d etf"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://etf:etf@db:5432/etf
    ports:
      - "3000:3000"
    entrypoint: ["sh", "-c", "node scripts/migrate.mjs && exec node server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/sources').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://etf:etf@db:5432/etf
    entrypoint: ["node", "source-worker.cjs"]

volumes:
  pgdata:
